services:
  postgres:
    image: postgres:17
    container_name: my-postgresql
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asghar
      POSTGRES_DB: devtrack

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
